name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.25.0

jobs:
  quality-and-web:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Validate mobile release configuration
        run: pnpm release:validate "$(node -p "require('./apps/mobile/app.json').expo.version")"

      - name: Test the embedded Node runtime
        run: pnpm test:node-runtime

      - name: Verify upstreams, native modules, and repository secrets
        run: pnpm upstreams:verify && pnpm native-modules:verify && pnpm secrets:check

      - name: Bundle the embedded runtime
        run: pnpm runtime:bundle

      - name: Export the web app
        run: pnpm --filter @runwhale/mobile export:web

      - name: Upload web and runtime outputs
        uses: actions/upload-artifact@v4
        with:
          name: web-and-mobile-runtime
          path: |
            apps/mobile/dist
            native/node-host/runtime
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-logs
          path: |
            apps/**/*.log
            apps/**/metro-error.txt
            packages/**/*.log
            native/**/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Write CI summary
        if: always()
        run: |
          {
            echo '## Continuous Integration'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Node.js: \`${NODE_VERSION}\`"
            echo "- pnpm: \`${PNPM_VERSION}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo '- Native host builds: skipped (use the Native Build workflow when needed)'
          } >> "$GITHUB_STEP_SUMMARY"
